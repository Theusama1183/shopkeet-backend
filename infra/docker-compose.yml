# Shopkeet dev stack — backend + Phase 7 observability (Prometheus + Grafana).
# Grafana dashboards are provisioned from infra/grafana/dashboards (idempotent).

services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    volumes:
      - ../apps/api:/app
    environment:
      - DATABASE_URL=postgres://shopkeet_app:shopkeet_app@postgres:5432/shopkeet?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - PORT=3001
      - JWT_SECRET=dev-secret-not-for-prod
      - APP_BASE_DOMAIN=shopkeet.dev
      - METRICS_TOKEN=dev-metrics-token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=shopkeet
      - POSTGRES_PASSWORD=shopkeet
      - POSTGRES_DB=shopkeet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopkeet -d shopkeet"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Phase 7 — /metrics is bearer-token gated; Prometheus scrapes with the
  # dev token and Grafana renders the provisioned Shopkeet dashboard.
  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data: